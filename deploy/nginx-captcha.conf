server {
    listen 80;
    listen [::]:80;
    server_name captcha.oxygenai.top;

    location /.well-known/acme-challenge/ {
        root /var/www/oxygenchallenge-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name captcha.oxygenai.top;

    # Replace these paths with the certificate selected by the server's ACME manager.
    ssl_certificate /etc/letsencrypt/live/captcha.oxygenai.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/captcha.oxygenai.top/privkey.pem;

    client_max_body_size 16k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        proxy_pass http://127.0.0.1:8791;
        access_log off;
    }

    location /v1/ {
        add_header Cache-Control "no-store, max-age=0" always;
        proxy_pass http://127.0.0.1:8791;
    }

    location = /embed {
        add_header Cache-Control "no-store, max-age=0" always;
        proxy_pass http://127.0.0.1:8791;
    }

    location = /widget.js {
        add_header Cache-Control "public, max-age=300" always;
        proxy_pass http://127.0.0.1:8791;
    }

    location = /widget.css {
        add_header Cache-Control "public, max-age=300" always;
        proxy_pass http://127.0.0.1:8791;
    }

    location = /frame.js {
        add_header Cache-Control "public, max-age=300" always;
        proxy_pass http://127.0.0.1:8791;
    }

    location / {
        proxy_pass http://127.0.0.1:8791;
    }
}
