openapi: 3.1.0
info:
  title: OxygenChallenge API
  version: 26.0.0-alpha.10
  description: Risk-aware CAPTCHA API with v1 compatibility and vNext client-context risk assessment.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://captcha.oxygenai.top
security: []
paths:
  /v2/meta:
    get:
      operationId: getV2Meta
      summary: Get vNext API metadata
      responses:
        "200":
          description: vNext metadata
        "400":
          description: Invalid API version header
  /v2/risk/assess:
    post:
      operationId: assessV2Risk
      summary: Assess request risk from browser and client context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskContextRequest"
      responses:
        "200":
          description: Risk assessment
        "400":
          description: Invalid client context
        "403":
          description: Origin or action denied
  /v2/challenges:
    post:
      operationId: createV2Challenge
      summary: Create a vNext challenge with required client context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateV2ChallengeRequest"
      responses:
        "200":
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "400":
          description: Invalid request or missing client context
        "403":
          description: Origin or action denied
  /v2/challenges/{id}/verify:
    post:
      operationId: verifyV2Challenge
      summary: Verify a vNext challenge response
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeEvidence"
      responses:
        "200":
          description: Verification result, a step result, or a generic failure
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VerificationReceipt"
                  - $ref: "#/components/schemas/StepPassed"
                  - $ref: "#/components/schemas/VerificationFailure"
        "410":
          description: Challenge expired or consumed
  /v2/challenges/{id}/swap:
    post:
      operationId: swapV2Challenge
      summary: Replace an eligible vNext challenge
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                accessible:
                  type: boolean
                  default: false
                accessibilityNeeds:
                  type: array
                  maxItems: 4
                  items:
                    type: string
                    enum: [vision, motor, hearing, speech, cognitive]
      responses:
        "200":
          description: Challenge replaced
          content:
            application/json:
              schema:
                type: object
                required: [swapped, challengeId, type]
                properties:
                  swapped:
                    type: boolean
                  challengeId:
                    type: string
                  preview:
                    type: boolean
                  type:
                    $ref: "#/components/schemas/ChallengeType"
                  sessionId:
                    type: string
                  nextEmbedUrl:
                    type: string
                    format: uri
        "403":
          description: Replacement is not allowed for this device or challenge
        "404":
          description: Challenge not found
  /v2/challenges/{id}/overlay.svg:
    get:
      operationId: getV2InverseOverlay
      summary: Get the vNext inverse-occlusion digit SVG
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      responses:
        "200":
          description: SVG image
          content:
            image/svg+xml:
              schema:
                type: string
        "410":
          description: Challenge expired or wrong type
  /v2/challenges/{id}/audio.wav:
    get:
      operationId: getV2AccessibilityAudio
      summary: Get the vNext DTMF accessibility audio
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      responses:
        "200":
          description: WAV audio
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "410":
          description: Challenge expired or wrong type
  /v2/challenges/{id}/target.svg:
    get:
      operationId: getV2GridTarget
      summary: Get the vNext grid target SVG
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      responses:
        "200":
          description: SVG target image
          content:
            image/svg+xml:
              schema:
                type: string
        "410":
          description: Challenge expired or wrong type
  /v2/challenges/{id}/tile/{index}.svg:
    get:
      operationId: getV2GridTile
      summary: Get a vNext grid tile SVG
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
        - in: path
          name: index
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 8
      responses:
        "200":
          description: SVG tile image
          content:
            image/svg+xml:
              schema:
                type: string
        "410":
          description: Challenge expired or wrong type
  /v2/challenges/{id}/sequence.wav:
    get:
      operationId: getV2AudioSequence
      summary: Get the vNext synthesized animal sound sequence
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      responses:
        "200":
          description: WAV sequence
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "410":
          description: Challenge expired or wrong type
  /v2/animal-sounds/{animal}.wav:
    get:
      operationId: getV2AnimalSoundPreview
      summary: Get one vNext animal sound preview
      parameters:
        - in: path
          name: animal
          required: true
          schema:
            type: string
            enum: [cat, dog, bird, monkey, horse, snake, bear, mouse, elephant, seal]
      responses:
        "200":
          description: WAV clip
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "404":
          description: Unknown animal
  /v2/siteverify:
    post:
      operationId: siteverifyV2
      summary: Consume a vNext verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret, response]
              properties:
                secret:
                  type: string
                response:
                  type: string
                action:
                  type: string
      responses:
        "200":
          description: Site verification result
        "400":
          description: Invalid request
  /v1/challenges:
    post:
      operationId: createChallenge
      summary: Create a one-time challenge
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChallengeRequest"
      responses:
        "200":
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "400":
          description: Invalid request
        "403":
          description: Origin or action denied
        "404":
          description: Site key not found
  /v1/challenges/{id}/verify:
    post:
      operationId: verifyChallenge
      summary: Verify a challenge response
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeEvidence"
      responses:
        "200":
          description: Verification result or a generic failure
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VerificationReceipt"
                  - $ref: "#/components/schemas/StepPassed"
                  - $ref: "#/components/schemas/VerificationFailure"
        "410":
          description: Challenge expired or consumed
  /v1/challenges/{id}/swap:
    post:
      operationId: swapChallenge
      summary: Replace an eligible camera, microphone, or Turnstile challenge
      description: "Desktop media challenges can be replaced once. Passing `accessible: true` requests the audio-enabled inverse-occlusion alternative."
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                accessible:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Challenge replaced
          content:
            application/json:
              schema:
                type: object
                required: [swapped, challengeId, type]
                properties:
                  swapped:
                    type: boolean
                  challengeId:
                    type: string
                  preview:
                    type: boolean
                  type:
                    $ref: "#/components/schemas/ChallengeType"
                  sessionId:
                    type: string
                  nextEmbedUrl:
                    type: string
                    format: uri
        "403":
          description: Replacement is not allowed for this device or challenge
        "404":
          description: Challenge not found
  /v1/challenges/{id}/overlay.svg:
    get:
      operationId: getInverseOverlay
      summary: Get the inverse-occlusion digit SVG
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      responses:
        "200":
          description: SVG image
          content:
            image/svg+xml:
              schema:
                type: string
        "410":
          description: Challenge expired or wrong type
  /v1/challenges/{id}/audio.wav:
    get:
      operationId: getAccessibilityAudio
      summary: Get the DTMF accessibility audio
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      responses:
        "200":
          description: WAV audio
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "410":
          description: Challenge expired or wrong type
  /v1/challenges/{id}/target.svg:
    get:
      operationId: getGridTarget
      summary: Get the grid target SVG
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      responses:
        "200":
          description: SVG target image
          content:
            image/svg+xml:
              schema:
                type: string
        "410":
          description: Challenge expired or wrong type
  /v1/challenges/{id}/tile/{index}.svg:
    get:
      operationId: getGridTile
      summary: Get a grid tile SVG
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
        - in: path
          name: index
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 8
      responses:
        "200":
          description: SVG tile image
          content:
            image/svg+xml:
              schema:
                type: string
        "410":
          description: Challenge expired or wrong type
  /v1/challenges/{id}/sequence.wav:
    get:
      operationId: getAudioSequence
      summary: Get the synthesized animal sound sequence
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      responses:
        "200":
          description: WAV sequence
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "410":
          description: Challenge expired or wrong type
  /v1/animal-sounds/{animal}.wav:
    get:
      operationId: getAnimalSoundPreview
      summary: Get one synthesized animal sound for option audition
      parameters:
        - in: path
          name: animal
          required: true
          schema:
            type: string
            enum: [cat, dog, bird, monkey, horse, snake, bear, mouse, elephant, seal]
      responses:
        "200":
          description: WAV clip
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "404":
          description: Unknown animal
  /v1/siteverify:
    post:
      operationId: siteverify
      summary: Consume a verification token
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret, response]
              properties:
                secret:
                  type: string
                response:
                  type: string
                action:
                  type: string
      responses:
        "200":
          description: Site verification result
        "400":
          description: Invalid request
  /embed:
    get:
      operationId: renderEmbed
      summary: Render the embeddable challenge page
      parameters:
        - in: query
          name: sitekey
          required: false
          schema:
            type: string
        - in: query
          name: action
          required: false
          schema:
            type: string
            default: submit
        - in: query
          name: parentOrigin
          required: false
          schema:
            type: string
            format: uri
        - in: query
          name: challengeType
          required: false
          schema:
            $ref: "#/components/schemas/ChallengeType"
        - in: query
          name: risk
          required: false
          schema:
            $ref: "#/components/schemas/RiskLevel"
        - in: query
          name: steps
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 8
        - in: query
          name: session
          required: false
          schema:
            type: string
        - in: query
          name: accessible
          required: false
          schema:
            type: string
            enum: ["0", "1"]
        - in: query
          name: apiVersion
          required: false
          schema:
            type: string
            enum: ["1", "2"]
        - in: query
          name: clientContext
          required: false
          description: JSON-encoded ClientContext. Required for API v2 embeds.
          schema:
            type: string
        - in: query
          name: accessibilityNeeds
          required: false
          description: Comma-separated accessibility needs.
          schema:
            type: string
      responses:
        "200":
          description: HTML widget
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Invalid embed parameters
        "403":
          description: Origin or action denied
        "404":
          description: Site key not found
  /healthz:
    get:
      operationId: healthcheck
      summary: Health check
      responses:
        "200":
          description: Healthy
        "404":
          description: Unknown health route
        "503":
          description: Service unavailable
components:
  parameters:
    ApiVersion:
      in: header
      name: X-Oxygen-Challenge-API-Version
      required: false
      description: Optional version assertion. Use `1`/`v1` for the compatibility API or `2`/`v2` for vNext.
      schema:
        type: string
        enum: ["1", "v1", "2", "v2"]
    ChallengeId:
      in: path
      name: id
      required: true
      schema:
        type: string
  schemas:
    ChallengeType:
      type: string
      enum:
        - inverse_occlusion
        - grid_select
        - motion_drag
        - audio_sequence
        - calculation
        - key_pointer
        - pattern_memory
        - count_flash
        - market_trade
        - human_check
        - rotate_align
        - semantic_pick
        - turnstile
        - hand_motion
        - speech_wave
    RiskLevel:
      type: string
      enum: [low, medium, high, critical]
    CreateChallengeRequest:
      type: object
      required: [siteKey]
      properties:
        siteKey:
          type: string
        action:
          type: string
          default: submit
        accessible:
          type: boolean
          default: false
        challengeType:
          $ref: "#/components/schemas/ChallengeType"
        risk:
          $ref: "#/components/schemas/RiskLevel"
        steps:
          type: integer
          minimum: 1
          maximum: 8
        accessibilityNeeds:
          type: array
          maxItems: 4
          items:
            type: string
            enum: [vision, motor, hearing, speech, cognitive]
        clientContext:
          $ref: "#/components/schemas/ClientContext"
    CreateV2ChallengeRequest:
      allOf:
        - $ref: "#/components/schemas/CreateChallengeRequest"
        - type: object
          required: [clientContext]
          properties:
            clientContext:
              $ref: "#/components/schemas/ClientContext"
    RiskContextRequest:
      type: object
      required: [siteKey, clientContext]
      properties:
        siteKey:
          type: string
        action:
          type: string
          default: submit
        risk:
          $ref: "#/components/schemas/RiskLevel"
        clientContext:
          $ref: "#/components/schemas/ClientContext"
    ClientContext:
      type: object
      required: [timezone, timezoneOffsetMinutes, systemLanguage]
      properties:
        timezone:
          type: string
          example: Asia/Shanghai
        timezoneOffsetMinutes:
          type: integer
          minimum: -840
          maximum: 840
          example: -480
        systemLanguage:
          type: string
          example: zh-CN
        languages:
          type: array
          maxItems: 12
          items:
            type: string
        selectedLanguage:
          type: string
          example: zh-CN
        platform:
          type: string
        hardwareConcurrency:
          type: integer
          minimum: 0
        deviceMemory:
          type: number
          minimum: 0
        touchPoints:
          type: integer
          minimum: 0
        colorScheme:
          type: string
          enum: [light, dark, no-preference]
        reducedMotion:
          type: boolean
        webdriver:
          type: boolean
        cookiesEnabled:
          type: boolean
        screen:
          type: object
          properties:
            width:
              type: number
            height:
              type: number
            pixelRatio:
              type: number
            colorDepth:
              type: integer
    ChallengeResponse:
      type: object
      required: [challengeId, type, siteKey, action, expiresAt, prompt, maxAttempts]
      properties:
        challengeId:
          type: string
        type:
          $ref: "#/components/schemas/ChallengeType"
        siteKey:
          type: string
        action:
          type: string
        sessionId:
          type: string
        step:
          type: integer
          minimum: 1
        totalSteps:
          type: integer
          minimum: 1
          maximum: 8
        risk:
          $ref: "#/components/schemas/RiskLevel"
        deviceClass:
          type: string
          enum: [desktop, mobile]
        preview:
          type: boolean
        swapAllowed:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        prompt:
          type: string
        maxAttempts:
          type: integer
        backgroundColor:
          type: string
        inverseColor:
          type: string
        overlayUrl:
          type: string
          format: uri
        audioUrl:
          type: string
          format: uri
        decoyText:
          type: string
        targetName:
          type: string
        targetUrl:
          type: string
          format: uri
        tileUrls:
          type: array
          items:
            type: string
            format: uri
        motion:
          type: object
          properties:
            seed:
              type: integer
            width:
              type: number
            height:
              type: number
            durationMs:
              type: integer
            requiredCoverageMs:
              type: integer
            targetRadius:
              type: number
        options:
          type: array
          items:
            type: object
            required: [key, label]
            properties:
              key:
                type: string
                enum: [cat, dog, bird, monkey, horse, snake, bear, mouse, elephant, seal]
              label:
                type: string
        anchorKey:
          type: string
          enum: [cat, dog, bird, monkey, horse, snake, bear, mouse, elephant, seal]
        anchorLabel:
          type: string
        expression:
          type: string
        requiredDistance:
          type: number
        requiredHoldMs:
          type: integer
        requiredKey:
          type: string
        requiredKeyLabel:
          type: string
        pattern:
          type: object
          properties:
            seed:
              type: integer
            sequenceLength:
              type: integer
        countFlash:
          type: object
          properties:
            seed:
              type: integer
            revealMs:
              type: integer
        market:
          type: object
          properties:
            seed:
              type: integer
            width:
              type: number
            height:
              type: number
            mode:
              type: string
              enum: [single, target]
            sampleMs:
              type: integer
            durationMs:
              type: integer
            initialCapital:
              type: number
            targetCapital:
              type: number
        humanCheck:
          type: object
          properties:
            minDwellMs:
              type: integer
        rotateAlign:
          type: object
          properties:
            initialAngle:
              type: number
            tolerance:
              type: number
        semanticPick:
          type: object
          properties:
            question:
              type: string
            options:
              type: array
              items:
                type: object
                required: [key, label]
                properties:
                  key:
                    type: string
                  label:
                    type: string
        turnstileSiteKey:
          type: string
        handMotion:
          type: object
          properties:
            sequence:
              type: array
              maxItems: 6
              items:
                type: string
                enum: [open, fist, peace, thumb_up, thumb_down, point_up, ok, call_me, l_sign, pinky]
            holdMs:
              type: integer
        speechWave:
          type: object
          properties:
            phrase:
              type: string
            targetWords:
              type: array
              items:
                type: string
            focusWindows:
              type: array
              items:
                type: object
                required: [targetWord, start, end]
                properties:
                  targetWord:
                    type: string
                  start:
                    type: number
                  end:
                    type: number
            takeCount:
              type: integer
              const: 3
    ChallengeEvidence:
      type: object
      properties:
        answer:
          type: string
        selectedIndices:
          type: array
          maxItems: 9
          uniqueItems: true
          items:
            type: integer
            minimum: 0
            maximum: 8
        point:
          type: object
          required: [x, y, elapsedMs]
          properties:
            x:
              type: number
            y:
              type: number
            elapsedMs:
              type: integer
        coverageMs:
          type: integer
          minimum: 0
        holdMs:
          type: integer
          minimum: 0
        keyCode:
          type: string
        distance:
          type: number
          minimum: 0
        marketTrades:
          type: array
          maxItems: 30
          items:
            type: object
            required: [buyIndex, sellIndex]
            properties:
              buyIndex:
                type: integer
                minimum: 0
              sellIndex:
                type: integer
                minimum: 0
        market:
          description: Legacy single-trade shape retained for alpha.4 clients.
          type: object
          required: [buyIndex, sellIndex]
          properties:
            buyIndex:
              type: integer
              minimum: 0
            sellIndex:
              type: integer
              minimum: 0
        dwellMs:
          type: integer
          minimum: 0
          maximum: 10000
        angle:
          type: number
          minimum: -180
          maximum: 180
        turnstileToken:
          type: string
          maxLength: 2048
        handGestures:
          type: array
          maxItems: 6
          items:
            type: object
            required: [action, durationMs]
            properties:
              action:
                type: string
                enum: [open, fist, peace, thumb_up, thumb_down, point_up, ok, call_me, l_sign, pinky]
              durationMs:
                type: integer
                minimum: 0
                maximum: 5000
        audioTakes:
          type: array
          maxItems: 3
          items:
            type: array
            maxItems: 160
            items:
              type: array
              maxItems: 8
              items:
                type: number
                minimum: -8
                maximum: 8
    VerificationReceipt:
      type: object
      required: [verified, token, assuranceLevel, action, siteKey, expiresAt]
      properties:
        verified:
          type: boolean
          const: true
        token:
          type: string
        assuranceLevel:
          type: string
          const: A1
        action:
          type: string
        siteKey:
          type: string
        sessionId:
          type: string
        risk:
          $ref: "#/components/schemas/RiskLevel"
        stepsCompleted:
          type: integer
          minimum: 1
          maximum: 8
        expiresAt:
          type: string
          format: date-time
    StepPassed:
      type: object
      required:
        - verified
        - stepPassed
        - code
        - sessionId
        - step
        - totalSteps
        - nextChallenge
        - nextEmbedUrl
      properties:
        verified:
          type: boolean
          const: false
        stepPassed:
          type: boolean
          const: true
        code:
          type: string
          const: STEP_PASSED
        sessionId:
          type: string
        step:
          type: integer
        totalSteps:
          type: integer
        remainingSteps:
          type: integer
        nextChallenge:
          type: object
          additionalProperties: true
        nextEmbedUrl:
          type: string
          format: uri
    VerificationFailure:
      type: object
      required: [verified, code]
      properties:
        verified:
          type: boolean
          const: false
        code:
          type: string
          enum:
            - INVALID_ANSWER
            - INVALID_SELECTION
            - INVALID_POINT
            - INVALID_GESTURE
            - ATTEMPTS_EXHAUSTED
            - CHALLENGE_EXPIRED
            - CHALLENGE_USED
            - CHALLENGE_NOT_FOUND
        remainingAttempts:
          type: integer
