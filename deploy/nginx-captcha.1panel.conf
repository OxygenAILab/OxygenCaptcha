# OxygenChallenge behind the existing 1Panel OpenResty container.
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name captcha.oxygenai.top;

    access_log /www/sites/captcha.oxygenai.top/log/access.log main;
    error_log /www/sites/captcha.oxygenai.top/log/error.log;

    ssl_certificate /www/sites/captcha.oxygenai.top/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/captcha.oxygenai.top/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    client_max_body_size 16k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        proxy_pass http://127.0.0.1:8791;
        access_log off;
    }

    location /v1/ {
        add_header Cache-Control "no-store, max-age=0" always;
        proxy_pass http://127.0.0.1:8791;
    }

    location = /embed {
        add_header Cache-Control "no-store, max-age=0" always;
        proxy_pass http://127.0.0.1:8791;
    }

    location = /widget.js {
        add_header Cache-Control "public, max-age=300" always;
        proxy_pass http://127.0.0.1:8791;
    }

    location = /widget.css {
        add_header Cache-Control "public, max-age=300" always;
        proxy_pass http://127.0.0.1:8791;
    }

    location = /frame.js {
        add_header Cache-Control "public, max-age=300" always;
        proxy_pass http://127.0.0.1:8791;
    }

    location / {
        proxy_pass http://127.0.0.1:8791;
    }
}
